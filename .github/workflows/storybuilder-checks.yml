name: StoryBuilder checks

on:
  push:
    branches:
      - fix/build-contract-from-idea-test
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and builder modules
        run: python -m compileall -q storybuilder.py builder tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
