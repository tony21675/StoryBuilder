name: StoryBuilder checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-ui.txt
      - name: Compile application and builder modules
        run: python -m compileall -q storybuilder.py story_bible_qt.py builder tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
