name: StoryBuilder tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - redesign/simplified-writing-workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybuilder-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q builder storybuilder.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
